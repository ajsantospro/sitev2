<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscrição em Turma — AJ Santos</title>
<link rel="icon" href="logo-icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--navy:#090956;--navy-2:#12136e;--navy-3:#050534;--ink:#0b0e1a;--mint:#71ffcc;--mint-dim:#3fdba8;--paper:#ffffff;--fog:#f3f5fb;--slate:#5b6478;--line:#e2e6f2;--line-dark:rgba(255,255,255,.14);}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;color:var(--ink);background:var(--fog);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:600;letter-spacing:-0.01em;color:var(--navy);}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:640px;margin:0 auto;padding:0 24px;}
  header{background:linear-gradient(180deg,var(--navy),var(--navy-2));padding:26px 0;}
  .logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk';font-weight:700;font-size:1.05rem;color:#fff;}
  .logo img{height:30px;width:auto;}
  main{padding:48px 0 80px;}
  .card{background:var(--paper);border-radius:20px;padding:36px;border:1px solid var(--line);}
  .eyebrow{font-family:'Space Grotesk';font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mint-dim);font-weight:700;margin-bottom:10px;}
  h1{font-size:1.5rem;margin-bottom:8px;}
  .sub{color:var(--slate);font-size:.92rem;margin-bottom:28px;}

  label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px;margin-top:20px;}
  label:first-of-type{margin-top:0;}
  select, input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-family:'Inter';font-size:.94rem;background:#fff;}
  select:focus, input:focus{outline:2px solid var(--mint-dim);border-color:transparent;}

  .turmas-list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}

  .next-turma-card{
    border:2px solid var(--mint-dim);border-radius:14px;padding:20px 18px;
    background:linear-gradient(135deg, rgba(63,219,168,.06), rgba(63,219,168,.02));
    position:relative;
  }
  .next-turma-card .urgency-badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--navy);color:#fff;font-size:.72rem;font-weight:700;
    padding:5px 12px;border-radius:100px;margin-bottom:14px;font-family:'Space Grotesk';
    text-transform:uppercase;letter-spacing:.04em;
  }
  .next-turma-card .urgency-badge::before{content:'●';color:var(--mint);font-size:.6rem;}
  .next-turma-card .data{font-family:'Space Grotesk';font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:4px;}
  .next-turma-card .horario{color:var(--slate);font-size:.9rem;margin-bottom:14px;}
  .next-turma-card .vagas-row{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px dashed var(--line);}
  .next-turma-card .vagas-label{font-size:.82rem;color:var(--slate);}
  .next-turma-card .vagas-num{font-family:'Space Grotesk';font-weight:700;color:var(--mint-dim);font-size:.95rem;}
  .next-turma-card .vagas-num.pouco{color:#d97706;}

  .turma-opt{
    border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;transition:border-color .15s;
  }
  .turma-opt:hover{border-color:var(--mint-dim);}
  .turma-opt.selected{border-color:var(--navy);background:var(--fog);}
  .turma-opt .info b{display:block;font-size:.94rem;color:var(--ink);}
  .turma-opt .info span{font-size:.8rem;color:var(--slate);}
  .turma-opt .vagas{font-size:.78rem;font-weight:700;color:var(--mint-dim);white-space:nowrap;}
  .turma-opt .vagas.pouco{color:#d97706;}

  .btn{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px 26px;border-radius:100px;font-weight:700;font-size:.94rem;
    font-family:'Space Grotesk';background:var(--navy);color:#fff;border:none;cursor:pointer;
    margin-top:28px;transition:background .2s;
  }
  .btn:hover{background:var(--navy-2);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .msg{font-size:.86rem;padding:12px 14px;border-radius:10px;margin-top:16px;display:none;}
  .msg.error{background:#fef2f2;color:#b91c1c;display:block;}
  .msg.loading{background:var(--fog);color:var(--slate);display:block;}

  .success{text-align:center;padding:20px 0;}
  .success .check{width:64px;height:64px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:1.8rem;color:var(--navy);}
  .success h2{margin-bottom:10px;}
  .success p{color:var(--slate);font-size:.94rem;margin-bottom:24px;}

  .empty{color:var(--slate);font-size:.9rem;padding:16px;text-align:center;background:var(--fog);border-radius:12px;}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="logo"><img src="logo-icon-white.png" alt="AJ Santos">AJ SANTOS</a>
  </div>
</header>

<main class="wrap">
  <div class="card" id="form-card">
    <div class="eyebrow">Inscrição em turma</div>
    <h1>Garanta sua vaga</h1>
    <p class="sub">Escolha o curso, selecione a data disponível e preencha seus dados. A confirmação chega por e-mail.</p>

    <label for="curso-select">Curso</label>
    <select id="curso-select">
      <option value="">Selecione um curso</option>
      <option value="Combo Híbrido">Combo Híbrido — IA + Tráfego Pago (8h) · R$ 997</option>
      <option value="Google Ads">Google Ads Prático PME (3h) · R$ 397</option>
      <option value="Meta Ads">Meta Ads para Vendas (3h) · R$ 397</option>
      <option value="Mastery Google+Meta">Mastery: Google + Meta Ads (5h) · R$ 697</option>
      <option value="IA do Zero">IA do Zero para Negócios (4h) · R$ 450</option>
    </select>

    <div id="turmas-container" style="display:none;">
      <label>Data da turma</label>
      <div class="turmas-list" id="turmas-list"></div>
    </div>

    <div id="dados-container" style="display:none;">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" placeholder="Seu nome completo">

      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="voce@empresa.com.br">

      <label for="telefone">Telefone / WhatsApp</label>
      <input type="text" id="telefone" placeholder="(11) 90000-0000">

      <button class="btn" id="submit-btn">Confirmar inscrição →</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <div class="card" id="success-card" style="display:none;">
    <div class="success">
      <div class="check">✓</div>
      <h2>Vaga garantida!</h2>
      <p>Anotamos sua inscrição. Em breve você recebe os detalhes de acesso e pagamento por e-mail.</p>
      <a href="index.html" class="btn" style="text-decoration:none;">Voltar para a Home</a>
    </div>
  </div>
</main>

<script>
  const SUPABASE_URL = "https://qwhxenojawjejmgqlxwd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_sxmLcGr8z03JMNekJg_07A_oACZyAHf";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const cursoSelect = document.getElementById('curso-select');
  const turmasContainer = document.getElementById('turmas-container');
  const turmasList = document.getElementById('turmas-list');
  const dadosContainer = document.getElementById('dados-container');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit-btn');

  let turmaSelecionada = null;

  // pre-seleciona curso via ?curso=NomeDoCurso na URL
  const params = new URLSearchParams(window.location.search);
  const cursoParam = params.get('curso');
  if (cursoParam) {
    cursoSelect.value = cursoParam;
    if (cursoSelect.value) carregarTurmas(cursoParam);
  }

  cursoSelect.addEventListener('change', () => {
    turmaSelecionada = null;
    dadosContainer.style.display = 'none';
    if (cursoSelect.value) {
      carregarTurmas(cursoSelect.value);
    } else {
      turmasContainer.style.display = 'none';
    }
  });

  async function carregarTurmas(curso) {
    turmasContainer.style.display = 'block';
    turmasList.innerHTML = '<div class="empty">Carregando turma...</div>';
    dadosContainer.style.display = 'none';
    turmaSelecionada = null;

    const { data, error } = await sb
      .from('turmas')
      .select('*')
      .eq('curso', curso)
      .eq('ativa', true)
      .order('data_aula', { ascending: true });

    if (error) {
      turmasList.innerHTML = '<div class="empty">Não foi possível carregar as turmas agora. Tente novamente em instantes.</div>';
      return;
    }

    const disponiveis = data.filter(t => t.vagas_ocupadas < t.vagas_totais);

    if (disponiveis.length === 0) {
      turmasList.innerHTML = '<div class="empty">Não há turmas com vaga aberta no momento. Fale com a gente no WhatsApp para saber a próxima data.</div>';
      return;
    }

    // Mostra só a próxima turma disponível (a mais próxima no calendário)
    const t = disponiveis[0];
    const restantes = t.vagas_totais - t.vagas_ocupadas;
    const dataFmt = new Date(t.data_aula + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

    turmasList.innerHTML = `
      <div class="next-turma-card">
        <span class="urgency-badge">Próxima turma</span>
        <div class="data">${dataFmt}</div>
        <div class="horario">${t.horario}</div>
        <div class="vagas-row">
          <span class="vagas-label">Vagas restantes</span>
          <span class="vagas-num ${restantes <= 3 ? 'pouco' : ''}">${restantes} vaga${restantes === 1 ? '' : 's'}</span>
        </div>
      </div>
    `;

    // seleciona automaticamente, já libera o formulário
    turmaSelecionada = t.id;
    dadosContainer.style.display = 'block';
    msg.style.display = 'none';
  }

  submitBtn.addEventListener('click', async () => {
    const nome = document.getElementById('nome').value.trim();
    const email = document.getElementById('email').value.trim();
    const telefone = document.getElementById('telefone').value.trim();

    if (!turmaSelecionada) {
      showMsg('Selecione uma data de turma.', 'error');
      return;
    }
    if (!nome || !email || !telefone) {
      showMsg('Preencha nome, e-mail e telefone.', 'error');
      return;
    }

    submitBtn.disabled = true;
    showMsg('Confirmando sua vaga...', 'loading');

    const { data, error } = await sb.rpc('inscrever_aluno', {
      p_turma_id: turmaSelecionada,
      p_nome: nome,
      p_email: email,
      p_telefone: telefone
    });

    if (error) {
      submitBtn.disabled = false;
      if (error.message && error.message.includes('lotada')) {
        showMsg('Essa turma acabou de lotar. Escolha outra data.', 'error');
        carregarTurmas(cursoSelect.value);
      } else {
        showMsg('Algo deu errado. Tente novamente ou fale no WhatsApp.', 'error');
      }
      return;
    }

    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  });

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
</script>

</body>
</html>
